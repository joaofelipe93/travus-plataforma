# Produção (VM): vai por cima do docker-compose.yml.
#   HTTPS com Let's Encrypt (HTTP redireciona), dashboard do Traefik fechado, HSTS,
#   backup diário do Postgres na VM e vigia com alertas por e-mail.
#
# Na VM, quem sobe é o deploy/vm/publicar.sh (make deploy na sua máquina):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build --wait
# Variáveis em deploy/.env (modelo: deploy/.env.producao.example).
# Para testar nesta máquina, com certificado não confiável: make prod-local.
services:
  traefik:
    ports:
      - "443:443"
    volumes:
      # Configuração estática de produção por cima do traefik.yml local.
      - ./traefik/traefik.producao.yml:/etc/traefik/traefik.yml:ro
      - letsencrypt:/letsencrypt
    labels:
      # Sem rota para o dashboard (o traefik.producao.yml também não liga a API interna).
      traefik.enable: "false"

  api:
    environment:
      APP_ORIGIN: https://${DOMINIO_APP:?defina DOMINIO_APP em deploy/.env}
      VIGIA_BACKUP_DIR: /backups
      VIGIA_CERTIFICADO: ${DOMINIO_APP}:443
      VIGIA_CHECKIN: "true"
      # Confere os bots: serviço sem resposta, número autorizado que caiu, fila parada.
      VIGIA_ATENDIMENTO: "true"
    volumes:
      - ${BACKUP_DIR:?defina BACKUP_DIR em deploy/.env}:/backups:ro
    labels:
      # le: Let's Encrypt; le-teste: ambiente de testes do Let's Encrypt (primeiro deploy).
      traefik.http.routers.app-api-health.tls.certresolver: ${CERT_RESOLVER:-le}
      traefik.http.routers.app-api-login.tls.certresolver: ${CERT_RESOLVER:-le}
      traefik.http.routers.app-api.tls.certresolver: ${CERT_RESOLVER:-le}
      traefik.http.routers.api-health.tls.certresolver: ${CERT_RESOLVER:-le}
      traefik.http.routers.api.tls.certresolver: ${CERT_RESOLVER:-le}

  web:
    environment:
      API_INTERNAL_URL: https://${DOMINIO_API:?defina DOMINIO_API em deploy/.env}
    labels:
      traefik.http.routers.web-publico.tls.certresolver: ${CERT_RESOLVER:-le}
      traefik.http.routers.web.tls.certresolver: ${CERT_RESOLVER:-le}

  # Notificador de check-in ligado em produção (localmente fica no perfil checkin).
  checkin-whatsapp:
    profiles: !reset []
    labels:
      traefik.http.routers.checkin-webhook.tls.certresolver: ${CERT_RESOLVER:-le}

  # Serviço de boletos ligado em produção (localmente fica no perfil boletos). São dois
  # containers: o que busca no Boleto Fácil e o que manda no WhatsApp dos clientes. Nada é
  # enviado enquanto BOLETOS_ENVIO_HABILITADO e a opção da tela estiverem desligadas.
  worker-boletos:
    profiles: !reset []

  boletos-whatsapp:
    profiles: !reset []

  # Atendimento no WhatsApp ligado em produção (localmente fica no perfil atendimento). Ele sobe
  # mesmo sem bot cadastrado: zero bot é zero sessão, e o processo parado custa pouco. Nada é
  # enviado enquanto ATENDIMENTO_ENVIO_HABILITADO e o interruptor de cada bot estiverem
  # desligados — e, sem número pareado, não há nem como.
  atendimento-whatsapp:
    profiles: !reset []
    environment:
      # **Teto menor que o padrão do código (4) de propósito.** Cada sessão do Baileys custa
      # memória, e esta VM tem 2 GB no total, dividida com Postgres, API, web, Traefik e os
      # outros dois serviços de WhatsApp. Dois bots cabem; subir isto pede redimensionar a VM
      # ANTES (docs/producao.md, seção 10).
      MAX_SESSOES: ${ATENDIMENTO_MAX_SESSOES:-2}
    # Limite coerente com o teto acima: o container morre e reinicia em vez de levar a VM
    # inteira junto se alguma sessão vazar memória.
    mem_limit: 512m

  # Um backup por dia, a partir de BACKUP_HORA, em BACKUP_DIR na própria VM.
  backup:
    profiles: !reset []
    command: ["diario"]
    restart: unless-stopped

volumes:
  letsencrypt:
