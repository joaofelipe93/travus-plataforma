# Travus Plataforma: ambiente local e base da produção (docker-compose.prod.yml por cima).
#   make up              sobe traefik, postgres, migrações, api, web e worker
#   make usuario args=…  cria/lista/desativa usuários (não há cadastro público)
#   make test            testes (api com Postgres, web, worker)
#   make backup          backup do Postgres agora (em deploy/backups)
#   make worker-dry-run  script legado: dry-run de 1 cota da planilha (nunca confirma lance)
#
# Sem o Makefile: cd deploy && docker compose up -d --build
# (as variáveis vêm de deploy/.env: POSTGRES_*, WORKER_TOKEN, CHAVE_CRIPTOGRAFIA; veja .env.example)
#
# LANCE REAL: desligado por padrão (LANCE_REAL_HABILITADO=false na API e no worker).
# Só ligue quando o usuário pedir o lance real, na hora.
name: travus

# Logs do Docker com rotação (em produção, o disco da VM não enche).
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api-base
  build: ../api
  image: travus/api:dev
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-travus}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}@postgres:5432/${POSTGRES_DB:-travus}?sslmode=disable
    APP_ORIGIN: ${APP_ORIGIN:-http://app.localhost}
    WORKER_TOKEN: ${WORKER_TOKEN:?defina WORKER_TOKEN em deploy/.env (make up gera)}
    CHAVE_CRIPTOGRAFIA: ${CHAVE_CRIPTOGRAFIA:?defina CHAVE_CRIPTOGRAFIA em deploy/.env (make up gera)}
    LANCE_REAL_HABILITADO: ${LANCE_REAL_HABILITADO:-false}
    # Google Drive (opcional): sem os três, os comprovantes ficam só na plataforma.
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_DRIVE_PASTA_ID: ${GOOGLE_DRIVE_PASTA_ID:-}
    # Alertas por e-mail (vigia da API). Sem SMTP_HOST, os alertas só vão para o log.
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORTA: ${SMTP_PORTA:-587}
    SMTP_USUARIO: ${SMTP_USUARIO:-}
    SMTP_SENHA: ${SMTP_SENHA:-}
    ALERTA_DE: ${ALERTA_DE:-}
    ALERTA_PARA: ${ALERTA_PARA:-}
    VIGIA_PING_URL: ${VIGIA_PING_URL:-}
    # Notificador de check-in (tela WhatsApp): a API chama as rotas de administração dele.
    CHECKIN_URL: http://checkin-whatsapp:3000
    CHECKIN_ADMIN_TOKEN: ${CHECKIN_ADMIN_TOKEN:?defina CHECKIN_ADMIN_TOKEN em deploy/.env (make up gera)}
    # Senha do papel checkin no Postgres: `api migrate up` liga o login com ela.
    CHECKIN_DB_SENHA: ${CHECKIN_DB_SENHA:?defina CHECKIN_DB_SENHA em deploy/.env (make up gera)}
    TZ: America/Sao_Paulo
  logging: *logs
  mem_limit: 256m

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # A pasta inteira (não arquivo por arquivo): editar dinamico.yml troca o arquivo,
      # e um bind mount de arquivo único continuaria vendo a versão antiga.
      - ./traefik:/etc/traefik:ro
    networks:
      borda:
        # Dentro da rede, os domínios do app e da API também apontam para o gateway:
        # assim o Next.js (lado servidor) chama a API passando pelo Traefik.
        aliases: ["${DOMINIO_API:-api.localhost}", "${DOMINIO_APP:-app.localhost}"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      - traefik.enable=true
      # Dashboard só no ambiente local (a produção desliga).
      - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
    logging: *logs
    mem_limit: 128m

  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-travus}
    volumes:
      # Postgres 18: o volume vai em /var/lib/postgresql (não mais em .../data).
      - postgres-dados:/var/lib/postgresql
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logs
    mem_limit: 512m

  # Aplica as migrações e termina; a api só sobe depois que ela sai com sucesso.
  migrate:
    <<: *api-base
    command: ["migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  api:
    <<: *api-base
    command: ["serve"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sem "ports". 8080: pública, só pelo Traefik. 8081: rotas do worker, sem rota no
    # Traefik (só a rede interna alcança).
    networks: [borda, interna]
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.services.api.loadbalancer.server.port=8080
      # Navegador: app.<domínio>/api/... (mesma origem do app, cookie SameSite=Strict).
      - traefik.http.routers.app-api-health.rule=Host(`${DOMINIO_APP:-app.localhost}`) && Path(`/api/health`)
      - traefik.http.routers.app-api-health.priority=100
      - traefik.http.routers.app-api-health.middlewares=remover-prefixo-api@file,limite-api@file,cabecalhos-seguranca@file
      - traefik.http.routers.app-api-login.rule=Host(`${DOMINIO_APP:-app.localhost}`) && Path(`/api/auth/login`)
      - traefik.http.routers.app-api-login.priority=100
      - traefik.http.routers.app-api-login.middlewares=remover-prefixo-api@file,limite-login@file,cabecalhos-seguranca@file
      - traefik.http.routers.app-api.rule=Host(`${DOMINIO_APP:-app.localhost}`) && PathPrefix(`/api/`)
      - traefik.http.routers.app-api.priority=50
      - traefik.http.routers.app-api.middlewares=sessao-api@file,remover-prefixo-api@file,limite-api@file,cabecalhos-seguranca@file
      # Ferramentas e, no futuro, o agente de IA: api.<domínio>/... (tudo protegido menos /health).
      - traefik.http.routers.api-health.rule=Host(`${DOMINIO_API:-api.localhost}`) && Path(`/health`)
      - traefik.http.routers.api-health.priority=100
      - traefik.http.routers.api-health.middlewares=limite-api@file,cabecalhos-seguranca@file
      - traefik.http.routers.api.rule=Host(`${DOMINIO_API:-api.localhost}`)
      - traefik.http.routers.api.priority=10
      - traefik.http.routers.api.middlewares=sessao-api@file,limite-api@file,cabecalhos-seguranca@file

  web:
    build: ../web
    image: travus/web:dev
    restart: unless-stopped
    environment:
      # Chamadas do lado servidor passam pelo gateway (alias de rede do Traefik).
      API_INTERNAL_URL: http://${DOMINIO_API:-api.localhost}
    depends_on:
      traefik:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [borda]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.http.services.web.loadbalancer.server.port=3000
      # Sem sessão: só a tela de login e os arquivos estáticos do Next.
      - traefik.http.routers.web-publico.rule=Host(`${DOMINIO_APP:-app.localhost}`) && (Path(`/login`) || PathPrefix(`/_next/`) || Path(`/favicon.ico`) || Path(`/robots.txt`))
      - traefik.http.routers.web-publico.priority=40
      - traefik.http.routers.web-publico.middlewares=cabecalhos-seguranca@file
      # Todo o resto do app exige sessão (sem sessão → /login).
      - traefik.http.routers.web.rule=Host(`${DOMINIO_APP:-app.localhost}`)
      - traefik.http.routers.web.priority=1
      - traefik.http.routers.web.middlewares=sessao-pagina@file,cabecalhos-seguranca@file
    logging: *logs
    mem_limit: 384m

  # Worker Canopus: pega execuções da fila na API interna (dry-run, reimpressão e, só com
  # LANCE_REAL_HABILITADO=true, lance real). Fora do Traefik; só na rede interna (precisa
  # de saída para o Newcon).
  worker-canopus:
    build: ../workers/canopus
    image: travus/worker-canopus:dev
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - path: ../workers/canopus/.env
        required: false
    environment:
      HOME: /tmp
      HEADFUL: "false"
      API_INTERNA_URL: http://api:8081
      WORKER_TOKEN: ${WORKER_TOKEN:?defina WORKER_TOKEN em deploy/.env (make up gera)}
      WORKER_NOME: canopus-1
      LANCE_REAL_HABILITADO: ${LANCE_REAL_HABILITADO:-false}
      TZ: America/Sao_Paulo
    depends_on:
      api:
        condition: service_healthy
    # Ao desligar, termina a cota atual antes de sair.
    stop_grace_period: 90s
    shm_size: 1gb
    networks: [interna]
    logging: *logs
    mem_limit: 1536m

  # Notificador de check-in: webhook de reserva do PMS → checkin.mensagens → grupo do WhatsApp.
  # Aqui fica desligado (perfil checkin: make checkin sobe; conecta ao WhatsApp e mostra QR); em
  # produção, o docker-compose.prod.yml o liga. UM container só: duas conexões na mesma sessão do
  # WhatsApp derrubam uma à outra, e cada processo enviaria a fila de novo.
  checkin-whatsapp:
    build: ../workers/checkin-whatsapp
    image: travus/checkin-whatsapp:dev
    profiles: [checkin]
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${CHECKIN_WEBHOOK_SECRET:?defina CHECKIN_WEBHOOK_SECRET em deploy/.env (make up gera)}
      # Rotas de administração (QR, grupos, teste, desconectar): só a API usa este token.
      ADMIN_TOKEN: ${CHECKIN_ADMIN_TOKEN:?defina CHECKIN_ADMIN_TOKEN em deploy/.env (make up gera)}
      # Grupo inicial; depois de parear, o admin escolhe pela tela.
      WHATSAPP_GROUP_JID: ${CHECKIN_WHATSAPP_GROUP_JID:-}
      DATABASE_URL: postgres://checkin:${CHECKIN_DB_SENHA:?defina CHECKIN_DB_SENHA em deploy/.env (make up gera)}@postgres:5432/${POSTGRES_DB:-travus}?sslmode=disable
      TZ: America/Sao_Paulo
    volumes:
      # Sessão do WhatsApp (credenciais do número pareado). Apagar o volume = parear de novo.
      - checkin-dados:/dados
    depends_on:
      migrate:
        condition: service_completed_successfully
    # borda: Traefik (só o webhook) e saída para o WhatsApp. interna: Postgres e, na B2, a API.
    networks: [borda, interna]
    # Fecha o HTTP, espera o ciclo da fila e desconecta do WhatsApp antes de sair.
    stop_grace_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.services.checkin-whatsapp.loadbalancer.server.port=3000
      # Única rota pública: o webhook (o serviço exige o token dele). /whatsapp/* (QR) e /events
      # (dados de hóspedes) não têm rota: em api.<domínio> caem na barreira de sessão da API.
      - traefik.http.routers.checkin-webhook.rule=Host(`${DOMINIO_API:-api.localhost}`) && Path(`/webhooks/nova-reserva`) && Method(`POST`)
      - traefik.http.routers.checkin-webhook.priority=100
      - traefik.http.routers.checkin-webhook.service=checkin-whatsapp
      - traefik.http.routers.checkin-webhook.middlewares=limite-api@file,cabecalhos-seguranca@file
    logging: *logs
    mem_limit: 256m

  # Backup do Postgres (deploy/backup/backup.sh). Aqui só roda quando chamado (make backup,
  # make restaurar-teste); em produção, o docker-compose.prod.yml o deixa ligado, um por dia.
  backup:
    image: postgres:18.6-alpine
    profiles: [backup]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["sh", "/backup/backup.sh"]
    command: ["agora"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-travus}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}
      PGDATABASE: ${POSTGRES_DB:-travus}
      BACKUP_HORA: ${BACKUP_HORA:-3}
      TZ: America/Sao_Paulo
    volumes:
      - ./backup:/backup:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]
    logging: *logs
    mem_limit: 256m

  # Comandos da API: make usuario args='criar …', make google-token, make alerta-teste.
  cli:
    <<: *api-base
    profiles: [cli]
    entrypoint: ["/api"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # Testes da API com Postgres (make test), num banco separado: travus_teste.
  api-teste:
    image: golang:1.26.8-alpine
    profiles: [teste]
    working_dir: /src
    command: ["sh", "-c", "go vet ./... && go test -p 1 -count=1 ./..."]
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-travus}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}@postgres:5432/travus_teste?sslmode=disable
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
    volumes:
      - ../api:/src
      - go-modulos:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # Testes do notificador de check-in (make test) no mesmo banco de teste, depois dos da API
  # (que aplicam as migrações). Imagem: a fase deps do Dockerfile; o código entra só para leitura.
  checkin-teste:
    build:
      context: ../workers/checkin-whatsapp
      target: deps
    image: travus/checkin-whatsapp-teste:dev
    profiles: [teste]
    working_dir: /app
    command: ["sh", "-c", "npm run typecheck && npm run typecheck:tests && npm test"]
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-travus}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}@postgres:5432/travus_teste?sslmode=disable
    volumes:
      - ../workers/checkin-whatsapp/src:/app/src:ro
      - ../workers/checkin-whatsapp/tests:/app/tests:ro
      - ../workers/checkin-whatsapp/tsconfig.json:/app/tsconfig.json:ro
      - ../workers/checkin-whatsapp/tsconfig.test.json:/app/tsconfig.test.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # Script legado (Etapa 0) em dry-run, lendo a planilha: make worker-dry-run.
  # O entrypoint bloqueia --confirm.
  worker-legado:
    build: ../workers/canopus
    image: travus/worker-canopus:dev
    profiles: [canopus]
    command: ["node", "src/index.js", "--dry-run", "--limit", "1"]
    # Mesmo uid do host para os screenshots em deploy/data/canopus não ficarem inacessíveis.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file:
      - path: ../workers/canopus/.env
        required: false
    environment:
      HOME: /tmp
      HEADFUL: "false"
      CSV_PATH: /app/entrada/cotasreal.csv
      DOWNLOAD_DIR: /app/data/downloads
      SCREENSHOT_DIR: /app/data/screenshots
      LOG_DIR: /app/data/logs
    volumes:
      - ../workers/canopus/cotasreal.csv:/app/entrada/cotasreal.csv:ro
      - ./data/canopus:/app/data
    shm_size: 1gb
    networks: [interna]
    mem_limit: 1536m

networks:
  borda:
    name: travus_borda
  interna:
    name: travus_interna

volumes:
  postgres-dados:
  checkin-dados:
  go-modulos:
  go-build:
